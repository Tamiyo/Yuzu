[workspace]
members = ["crates/*"]

# The binaries and the pyo3 extension carry no tests, and building the
# extension links against Python on every `cargo test`. Leave them out of the
# default loop; `cargo run -p yuzu_driver` and `cargo e2e` name them explicitly.
default-members = [
    "crates/yuzu_ast",
    "crates/yuzu_diagnostics",
    "crates/yuzu_driver",
    "crates/yuzu_ide",
    "crates/yuzu_mlir_sys",
    "crates/yuzu_lexer",
    "crates/yuzu_lsp",
    "crates/yuzu_mlir",
    "crates/yuzu_parser",
    "crates/yuzu_passes",
    "crates/yuzu_substrait",
    "crates/yuzu_syntax",
    "crates/yuzu_types",
]

resolver = "3"

# What every crate shares. None of them is published.
[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# The static verification of M-STATIC-VERIFICATION (Microsoft's Pragmatic
# Rust Guidelines). Every crate inherits it through `[lints] workspace = true`.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

literal_string_with_formatting_args = "allow"
# Dependencies pull in two versions of `syn` and of `rustc-hash`, which this
# workspace cannot unify.
multiple_crate_versions = "allow"
