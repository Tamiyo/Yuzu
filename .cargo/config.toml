[alias]
# The Python end-to-end suite: rebuilds the wheel, then runs pytest.
e2e = "test -p yuzu_python --test e2e -- --ignored --nocapture"

# Where mlir-sys and the tblgen crate find the pinned LLVM/MLIR toolchain.
[env]
MLIR_SYS_230_PREFIX = "/usr/lib/llvm-23"
TABLEGEN_230_PREFIX = "/usr/lib/llvm-23"

# lld links the static MLIR libraries in a fraction of the memory GNU ld
# needs, so parallel test links fit on a small machine. The LLVM clang
# driver finds its own ld.lld.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "linker=/usr/lib/llvm-23/bin/clang", "-C", "link-arg=-fuse-ld=lld"]
