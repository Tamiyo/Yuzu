[package]
name = "yuzu_lsp"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "yuzu-lsp"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
line-index = "0.1.2"
lsp-server = "0.10"
lsp-types = "=0.95.1"
rustc-hash = "2"
serde = "1"
serde_json = "1"
text-size = "1.1.1"

yuzu_diagnostics = { path = "../yuzu_diagnostics" }
yuzu_ide = { path = "../yuzu_ide" }

[dev-dependencies]
expect-test = "1.5.1"
